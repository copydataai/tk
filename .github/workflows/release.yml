name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TK_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      TK_NOTARY_PROFILE: tk-release-notary
      TK_NOTARY_KEYCHAIN: ${{ runner.temp }}/tk-release.keychain-db
      TK_SPARKLE_FEED_URL: https://github.com/copydataai/tk/releases/latest/download/appcast.xml
      TK_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      RELEASE_KEYCHAIN: ${{ runner.temp }}/tk-release.keychain-db
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Test and validate source
        run: |
          set -euo pipefail
          swift test
          swift build -Xswiftc -warnings-as-errors
          bash -n script/build_and_run.sh
          plutil -lint Assets/tk.entitlements

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/signing-certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RELEASE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RELEASE_KEYCHAIN"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$RELEASE_KEYCHAIN"
          security import "$certificate" \
            -k "$RELEASE_KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$RELEASE_KEYCHAIN_PASSWORD" \
            "$RELEASE_KEYCHAIN"
          security list-keychains -d user -s "$RELEASE_KEYCHAIN"
          rm -f "$certificate"

      - name: Configure notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$TK_NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN"

      - name: Build, sign, and notarize release
        env:
          TK_VERSION: ${{ github.ref_name }}
          TK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TK_VERSION="${TK_VERSION#v}"
          export TK_VERSION
          ./script/build_and_run.sh --release

      - name: Generate SHA256 checksum
        env:
          TK_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TK_VERSION#v}"
          dmg="dist/tk-$version.dmg"
          test -f "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TK_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TK_VERSION#v}"
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/copydataai/tk/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/copydataai/tk" \
              --versions "$GITHUB_RUN_NUMBER" \
              dist
          test -f dist/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TK_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TK_VERSION#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/tk-$version.dmg" \
            "dist/tk-$version.dmg.sha256" \
            "dist/appcast.xml" \
            --generate-notes \
            --title "tk $GITHUB_REF_NAME" \
            --verify-tag
